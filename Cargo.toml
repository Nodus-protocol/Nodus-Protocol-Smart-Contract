[package]
name = "amm-liquidity-pool"
version = "0.1.0"
authors = ["Nodus Protocol Team"]
edition = "2021"
license = "MIT"
description = "Constant-product AMM liquidity pool smart contract built with ink!"

[dependencies]
ink = { version = "5.0.0", default-features = false }
scale = { package = "parity-scale-codec", version = "3", default-features = false, features = ["derive"] }
scale-info = { version = "2.6", default-features = false, features = ["derive"], optional = true }
openbrush = { git = "https://github.com/Brushfam/openbrush-contracts", tag = "v4.0.0", default-features = false, features = ["psp22"] }

[dev-dependencies]
ink_e2e = { version = "5.0.0" }
proptest = { version = "1.4" }

[lib]
name = "amm_liquidity_pool"
path = "src/lib.rs"
crate-type = ["cdylib"]

[features]
default = ["std"]
std = [
    "ink/std",
    "scale/std",
    "scale-info/std",
    "openbrush/std",
]
ink-as-dependency = []
e2e-tests = []
fuzzing = ["proptest"]

[profile.release]
overflow-checks = false
panic = "abort"
lto = true
codegen-units = 1
opt-level = "z"
strip = true
