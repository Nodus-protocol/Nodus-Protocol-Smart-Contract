[package]
name = "nodus-amm"
version = "0.1.0"
authors = ["Nodus Protocol Team"]
edition = "2021"
license = "MIT"
description = "Constant-product AMM liquidity pool on Stellar Soroban"

[lib]
crate-type = ["cdylib"]

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = "22.0.0"

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }

[profile.release]
overflow-checks = true
panic = "abort"
lto = true
codegen-units = 1
opt-level = "z"
strip = "symbols"
